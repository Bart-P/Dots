services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.26.7
    container_name: n8n
    restart: unless-stopped
    user: "956:956"
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Berlin}
      HOME: /home/node
      XDG_CACHE_HOME: /home/node/.n8n/.cache
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_USER_FOLDER: /home/node
    volumes:
      - /var/lib/n8n/.n8n:/home/node/.n8n
      - /var/lib/n8n/.n8n/.cache:/home/node/.cache
      - /home/bp/Code/krayin-crm/storage/app/imports/n8n:/imports/n8n
